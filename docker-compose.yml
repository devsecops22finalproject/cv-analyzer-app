services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screener}
      POSTGRES_DB: screener
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d screener"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-screener}@db:5432/screener
      MUSE_SPARK_API_KEY: ${MUSE_SPARK_API_KEY:-}
      MUSE_SPARK_BASE_URL: ${MUSE_SPARK_BASE_URL:-https://opencode.ai/zen/go/v1}
      AI_MODEL: ${AI_MODEL:-muse-spark-1.3-contributor}
      AI_API: ${AI_API:-responses}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  pgdata:
